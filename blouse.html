<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blouse Designs</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    text-align: center;
}

.design {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: flex-start;
    border: 1px solid purple;
    padding: 6px;
    margin: 0 auto 10px;
    border-radius: 12px;
    max-width: 700px;
}

.design-item {
    width: 50%;
    min-width: 0;
}

.design-item img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}
</style>
</head>

<body>

<script>
(async function loadDesigns() {

    const owner = "davuluridsk-gif";
    const repo = "js-computer-embroidery-works";
    const folder = "designs";

    const api =
    https://api.github.com/repos/${owner}/${repo};

    const isImage = name =>
    /\.(jpe?g|png|webp)$/i.test(name);

    try {

        const response = await fetch(
            ${api}/commits?path=${folder}&per_page=100
        );

        if (!response.ok) {
            throw new Error("GitHub history unavailable");
        }

        const commits = await response.json();
        const uploaded = [];

        for (const commit of commits) {

            const detailResponse = await fetch(
                ${api}/commits/${commit.sha}
            );

            if (!detailResponse.ok) continue;

            const detail = await detailResponse.json();

            const date =
                detail.commit?.committer?.date ||
                detail.commit?.author?.date;

            if (!date) continue;

            (detail.files || []).forEach((file, index) => {

                const name =
                    file.filename.split("/").pop();

                if (
                    file.status === "added" &&
                    file.filename.startsWith(folder + "/") &&
                    isImage(name)
                ) {
                    uploaded.push({
                        path: file.filename,
                        time: new Date(date).getTime(),
                        index: index
                    });
                }

            });
        }

        const seen = new Set();

        const ordered = uploaded
            .sort((a, b) =>
                a.time - b.time || a.index - b.index
            )
            .filter(item => {

                if (seen.has(item.path)) return false;

                seen.add(item.path);
                return true;

            });

        for (
            let i = 0;
            i + 1 < ordered.length;
            i += 2
        ) {

            const box = document.createElement("div");
            box.className = "design";

            for (let j = 0; j < 2; j++) {

                const item = document.createElement("div");
                item.className = "design-item";

                const img = document.createElement("img");

                img.src =
                https://raw.githubusercontent.com/${owner}/${repo}/main/${ordered[i + j].path.split("/").map(encodeURIComponent).join("/")};

                img.alt = "";

                item.appendChild(img);
                box.appendChild(item);

            }

            document.body.appendChild(box);

        }

    } catch (error) {

        console.error("Could not load designs:", error);

    }

})();
</script>

</body>
</html>
