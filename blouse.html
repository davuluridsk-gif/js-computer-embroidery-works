<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blouse Designs - JS Embroidery</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 12px;
  text-align: center;
}
#designs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  max-width: 900px;
  margin: auto;
}
.design {
  display: flex;
  gap: 8px;
  border: 1px solid purple;
  padding: 6px;
  border-radius: 12px;
  align-items: flex-start;
}
.design img {
  width: 50%;
  height: auto;
  object-fit: contain;
}
@media (min-width: 600px) {
  #designs {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>

<h2>Blouse Designs</h2>
<div id="designs">Loading designs...</div>

<script>
const api =
"https://api.github.com/repos/davuluridsk-gif/js-computer-embroidery-works/contents/designs";

async function loadDesigns() {
  const container = document.getElementById("designs");

  try {
    const response = await fetch(api);
    if (!response.ok) throw new Error("Designs folder not found");

    const files = await response.json();
    const images = files.filter(file =>
      file.type === "file" &&
      /\.(jpg|jpeg|png|webp)$/i.test(file.name)
    );

    const pairs = {};

    images.forEach(file => {
      const match = file.name.match(/^(.*)-(back-neck|hand)\.(jpg|jpeg|png|webp)$/i);
      if (!match) return;

      const id = match[1].toLowerCase();
      const side = match[2].toLowerCase();

      if (!pairs[id]) pairs[id] = {};
      pairs[id][side] = file.download_url;
    });

    container.innerHTML = "";

    Object.keys(pairs).sort().forEach(id => {
      const pair = pairs[id];
      if (!pair["back-neck"] || !pair.hand) return;

      const card = document.createElement("div");
      card.className = "design";

      ["back-neck", "hand"].forEach(side => {
        const img = document.createElement("img");
        img.src = pair[side];
        img.alt = "";
        card.appendChild(img);
      });

      container.appendChild(card);
    });

    if (!container.children.length) {
      container.textContent = "No complete designs uploaded yet.";
    }
  } catch (error) {
    container.textContent =
      "Designs are not available yet. Please check the designs folder.";
  }
}

loadDesigns();
</script>

</body>
</html>
