<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blouse Designs - JS Embroidery</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 12px;
  text-align: center;
}

h2 {
  margin-bottom: 18px;
}

#designs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  max-width: 950px;
  margin: auto;
}

.design {
  display: flex;
  gap: 8px;
  border: 1px solid purple;
  padding: 6px;
  border-radius: 12px;
  align-items: flex-start;
  min-width: 0;
}

.design img {
  width: calc(50% - 4px);
  height: auto;
  object-fit: contain;
  display: block;
}

.message {
  padding: 20px;
  color: #555;
}

@media (min-width: 600px) {
  #designs {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<h2>Blouse Designs</h2>
<div id="designs">Loading designs...</div>

<script>
const baseAPI =
"https://api.github.com/repos/davuluridsk-gif/js-computer-embroidery-works/contents/designs";

function getImageType(filename) {
  if (!/\.(jpg|jpeg|png|webp)$/i.test(filename)) {
    return null;
  }

  const name = filename
    .replace(/\.(jpg|jpeg|png|webp)$/i, "")
    .trim()
    .toLowerCase()
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ");

  if (name === "back neck" || name === "neck") {
    return "neck";
  }

  if (name === "hand") {
    return "hand";
  }

  return null;
}

async function loadDesigns() {
  const container = document.getElementById("designs");

  try {
    const response = await fetch(baseAPI);

    if (!response.ok) {
      throw new Error("Unable to load designs folder");
    }

    const items = await response.json();

    const folders = items.filter(item => item.type === "dir");

    const results = await Promise.all(
      folders.map(async folder => {
        const folderAPI =
          baseAPI + "/" + encodeURIComponent(folder.name);

        const folderResponse = await fetch(folderAPI);

        if (!folderResponse.ok) return null;

        const files = await folderResponse.json();
        const pair = {};

        files.forEach(file => {
          if (file.type !== "file") return;

          const type = getImageType(file.name);

          if (type && file.download_url) {
            pair[type] = file.download_url;
          }
        });

        if (!pair.neck || !pair.hand) return null;

        return pair;
      })
    );

    container.innerHTML = "";

    results.filter(Boolean).forEach(pair => {
      const card = document.createElement("div");
      card.className = "design";

      [pair.neck, pair.hand].forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        img.alt = "";
        img.loading = "lazy";
        card.appendChild(img);
      });

      container.appendChild(card);
    });

    if (!container.children.length) {
      container.innerHTML =
        '<div class="message">No complete designs uploaded yet.</div>';
    }

  } catch (error) {
    container.innerHTML =
      '<div class="message">Unable to load designs. Please try again later.</div>';
  }
}

loadDesigns();
</script>

</body>
</html>
